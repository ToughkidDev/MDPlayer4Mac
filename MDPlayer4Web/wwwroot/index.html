<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MDPlayer4Web</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e6e6e6; }
    @media (prefers-color-scheme: dark) { html, body { background: #1f1f1f; } }
    #out { position: fixed; inset: 0; }
    /* Avalonia's software renderer leaves pixels of opaque bitmaps transparent; the
       native renderers show them black (the dashboard and channel views' background). */
    #out canvas { background: #000; }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #888;
    }
  </style>
</head>
<body>
  <div id="out"><div id="splash">MDPlayer4Web 불러오는 중…</div></div>
  <script type="module" src="main.js"></script>
</body>
</html>
