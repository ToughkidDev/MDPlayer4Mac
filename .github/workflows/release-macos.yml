name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained Apple Silicon build
        run: >-
          dotnet publish macos/MDPlayerUI/MDPlayerUI.csproj
          --configuration Release
          --runtime osx-arm64
          --self-contained true
          --property:PublishSingleFile=true
          --property:DebugType=None
          --output release/publish

      - name: Create signed macOS app bundle
        run: |
          APP="release/MDPlayer4Mac.app"
          MACOS_DIR="$APP/Contents/MacOS"
          RESOURCES_DIR="$APP/Contents/Resources"
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p "$MACOS_DIR" "$RESOURCES_DIR"
          cp -R release/publish/. "$MACOS_DIR/"
          cp macos/MDPlayerUI/Assets/MDPlayer4Mac.icns "$RESOURCES_DIR/MDPlayer4Mac.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleDisplayName</key><string>MDPlayer4Mac</string>
            <key>CFBundleExecutable</key><string>MDPlayer4Mac</string>
            <key>CFBundleIconFile</key><string>MDPlayer4Mac.icns</string>
            <key>CFBundleIdentifier</key><string>com.toughkiddev.mdplayer4mac</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>MDPlayer4Mac</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          find "$MACOS_DIR" -type f \( -name "*.dylib" -o -perm -111 \) -exec codesign --force --sign - --timestamp=none {} \;
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" release/MDPlayer4Mac-osx-arm64.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG_NAME" release/MDPlayer4Mac-osx-arm64.zip
          --title "MDPlayer4Mac $TAG_NAME"
          --generate-notes
