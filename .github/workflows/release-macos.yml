name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify independent native core
        run: dotnet run --project macos/MucoNativeTests/MucoNativeTests.csproj -c Release

      - name: Verify MSX playback
        run: dotnet run --project macos/MsxPlaybackTests/MsxPlaybackTests.csproj -c Release

      - name: Publish self-contained Apple Silicon build
        run: >-
          dotnet publish macos/MDPlayerUI/MDPlayerUI.csproj
          --configuration Release
          --runtime osx-arm64
          --self-contained true
          --property:PublishSingleFile=true
          --property:DebugType=None
          --property:Version=${GITHUB_REF_NAME#v}
          --output release/publish

      - name: Create signed macOS app bundle
        run: |
          APP="release/MDPlayer4Mac.app"
          MACOS_DIR="$APP/Contents/MacOS"
          RESOURCES_DIR="$APP/Contents/Resources"
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p "$MACOS_DIR" "$RESOURCES_DIR"
          cp -R release/publish/. "$MACOS_DIR/"
          cp macos/MDPlayerUI/Assets/MDPlayer4Mac.icns "$RESOURCES_DIR/MDPlayer4Mac.icns"
          mkdir -p "$RESOURCES_DIR/Licenses"
          cp LICENSE.txt "$RESOURCES_DIR/Licenses/MDPlayer4Mac.txt"
          cp macos/MDSound/LICENSE.txt "$RESOURCES_DIR/Licenses/MDSound.txt"
          cp macos/ThirdParty/mucomDotNET/LICENSE.txt "$RESOURCES_DIR/Licenses/mucomDotNET.txt"
          cp macos/MucomDriver/YMFM-LICENSE.txt "$RESOURCES_DIR/Licenses/YMFM.txt"
          cp macos/ThirdParty/PMDDotNET/LICENSE.txt "$RESOURCES_DIR/Licenses/PMDDotNET.txt"
          cp macos/ThirdParty/muapDotNET/license/LICENSE.txt "$RESOURCES_DIR/Licenses/muapDotNET.txt"
          cp macos/ThirdParty/muapDotNET/license/COPYING.TXT "$RESOURCES_DIR/Licenses/muapDotNET-COPYING.txt"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleDisplayName</key><string>MDPlayer4Mac</string>
            <key>CFBundleExecutable</key><string>MDPlayer4Mac</string>
            <key>CFBundleIconFile</key><string>MDPlayer4Mac.icns</string>
            <key>CFBundleIdentifier</key><string>com.toughkiddev.mdplayer4mac</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>MDPlayer4Mac</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          find "$MACOS_DIR" -type f ! -path "$MACOS_DIR/MDPlayer4Mac" -exec codesign --force --sign - --timestamp=none {} +
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test -f "$MACOS_DIR/libMDPlayerForceTouch.dylib"
          for sample in BD SD TOP HH TOM RIM; do
            test -s "$MACOS_DIR/2608_${sample}.WAV"
          done
          ditto -c -k --sequesterRsrc --keepParent "$APP" release/MDPlayer4Mac-osx-arm64.zip

      - name: Verify archive and write checksum
        working-directory: release
        run: |
          shasum -a 256 MDPlayer4Mac-osx-arm64.zip > MDPlayer4Mac-osx-arm64.zip.sha256
          mkdir verified
          ditto -x -k MDPlayer4Mac-osx-arm64.zip verified
          codesign --verify --deep --strict --verbose=2 verified/MDPlayer4Mac.app

      - name: Launch packaged app
        run: |
          APP="release/verified/MDPlayer4Mac.app"
          "$APP/Contents/MacOS/MDPlayer4Mac" > release/launch.log 2>&1 &
          PID=$!
          sleep 15
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID"
            wait "$PID" || true
          else
            cat release/launch.log
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          NOTES_FILE="macos/release-notes/$TAG_NAME.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG_NAME" release/MDPlayer4Mac-osx-arm64.zip release/MDPlayer4Mac-osx-arm64.zip.sha256 \
              --title "MDPlayer4Mac $TAG_NAME" --notes-file "$NOTES_FILE" --latest
          else
            gh release create "$TAG_NAME" release/MDPlayer4Mac-osx-arm64.zip release/MDPlayer4Mac-osx-arm64.zip.sha256 \
              --title "MDPlayer4Mac $TAG_NAME" --generate-notes --latest
          fi
